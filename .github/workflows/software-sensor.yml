name: Live software temperature sensor
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-software-sensor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-sensor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SENSOR_CORE_SHA: b897b93726ef4d02e596e0b83c568df269e29bcc
      SENSOR_CORE_SOURCE: ${{ github.workspace }}/core
      SENSOR_EVIDENCE: ${{ github.workspace }}/web/test-results/software-sensor
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Janik77/kz-home-core
          ref: ${{ env.SENSOR_CORE_SHA }}
          path: core
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: web
        run: |
          python -m pip install -r ../core/requirements-dev.txt playwright==1.65.0
          npm ci
          npx playwright install --with-deps chrome
      - name: Verify registration, display and restart using disposable TLS MQTT and PostgreSQL
        working-directory: web
        run: python -B e2e/software-sensor-live.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: software-sensor-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/test-results/software-sensor/
          if-no-files-found: ignore

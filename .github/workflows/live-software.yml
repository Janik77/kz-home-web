name: Live Web Core MQTT software relay
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-software-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chrome
      CORE_BASE_SHA: 1ae52afa22431943064b5e85313f671b073b9458
      BASELINE_WEB_SOURCE: ${{ github.workspace }}/web-before
      PYTHONDONTWRITEBYTECODE: '1'
      LIVE_CORE_SOURCE: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Janik77/kz-home-core
          ref: ${{ env.CORE_BASE_SHA }}
          path: core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c55dba53cb093c55d006dcd76f54b823a6f6e2be
          path: web-before
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies and browser
        working-directory: web
        run: |
          python -m venv "$RUNNER_TEMP/live-venv"
          "$RUNNER_TEMP/live-venv/bin/python" -m pip install -r ../core/requirements-dev.txt
          "$RUNNER_TEMP/live-venv/bin/python" -m pip check
          npm ci
          npm --prefix ../web-before ci
          npx playwright install --with-deps chrome
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Evidence verifier negative regressions
        working-directory: web
        run: |
          python -m unittest discover -s e2e -p test_confirmed_live_evidence.py -v
          python -m unittest discover -s e2e -p test_fixture_modes.py -v
      - name: Prepare disposable service images before inventory baseline
        run: |
          docker pull postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
          docker pull eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
          docker pull alpine/openssl:latest@sha256:6821afa2476e11be343f29275f2ca24291720ff0a7148bd131fd8e314ff26d9e
      - name: Numeric threshold real Core MQTT browser acceptance
        working-directory: web
        env:
          LIVE_NUMERIC_ONLY: '1'
        run: '"$RUNNER_TEMP/live-venv/bin/python" -B e2e/automation-live-runner.py'
      - name: External MQTT state and visible-page browser acceptance
        working-directory: web
        env:
          LIVE_STATE_ONLY: '1'
        run: 'xvfb-run -a --server-args="-screen 0 1440x1000x24" "$RUNNER_TEMP/live-venv/bin/python" -B e2e/automation-live-runner.py'
      - name: Real browser to Core to MQTT TLS software relay and PostgreSQL receipts
        working-directory: web
        run: '"$RUNNER_TEMP/live-venv/bin/python" -B e2e/confirmed-live-runner.py'
      - name: Automation event to confirmed receipt browser acceptance
        working-directory: web
        run: '"$RUNNER_TEMP/live-venv/bin/python" -B e2e/automation-live-runner.py'
      - name: Core combined regression suite
        working-directory: core
        run: '"$RUNNER_TEMP/live-venv/bin/python" -m pytest -q'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-software-evidence
          path: |
            web/test-results/numeric-live-evidence.json
            web/test-results/numeric-live/
            web/test-results/live-numeric-*.png
            web/test-results/state-live-evidence.json
            web/test-results/state-live/
            web/test-results/live-state-*.png
            web/test-results/automation-live-evidence.json
            web/test-results/automation-live/
            web/test-results/live-automation-*.png
            web/test-results/confirmed-live-evidence.json
            web/test-results/scene-live-evidence.json
            web/test-results/confirmed-live-preservation.json
            web/test-results/live-software-*.png
            web/test-results/live-software-*.webm
            web/test-results/live-space-*.webm
            web/test-results/live-space-*.png
            web/test-results/live-favorites-*
            web/test-results/scene-visual-*.json
            web/test-results/confirmed-live/**/*.webm
            web/test-results/scene-live-current/
            web/test-results/scene-live-before/
          if-no-files-found: error

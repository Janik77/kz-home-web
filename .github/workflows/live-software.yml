name: Live Web Core MQTT software relay
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-software-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_BASE_SHA: a2bc83aa2451590f71ac34f9aad1c7c328bccb19
      PYTHONDONTWRITEBYTECODE: '1'
      LIVE_CORE_SOURCE: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Janik77/kz-home-core
          ref: ${{ env.CORE_BASE_SHA }}
          path: core
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies and browser
        working-directory: web
        run: |
          python -m venv "$RUNNER_TEMP/live-venv"
          "$RUNNER_TEMP/live-venv/bin/python" -m pip install -r ../core/requirements-dev.txt
          "$RUNNER_TEMP/live-venv/bin/python" -m pip check
          npm ci
          npx playwright install --with-deps chromium
      - name: Evidence verifier negative regressions
        working-directory: web
        run: python -m unittest discover -s e2e -p test_confirmed_live_evidence.py -v
      - name: Prepare disposable service images before inventory baseline
        run: |
          docker pull postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
          docker pull eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
          docker pull alpine/openssl:latest@sha256:6821afa2476e11be343f29275f2ca24291720ff0a7148bd131fd8e314ff26d9e
      - name: Real browser to Core to MQTT TLS software relay and PostgreSQL receipts
        working-directory: web
        run: '"$RUNNER_TEMP/live-venv/bin/python" -B e2e/confirmed-live-runner.py'
      - name: Core combined regression suite
        working-directory: core
        run: '"$RUNNER_TEMP/live-venv/bin/python" -m pytest -q'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-software-evidence
          path: |
            web/test-results/confirmed-live-evidence.json
            web/test-results/confirmed-live-preservation.json
            web/test-results/live-software-*.png
          if-no-files-found: error

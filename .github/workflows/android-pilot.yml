name: Android pilot package
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Assemble exact source
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          npm ci
          npm run typecheck && npm run lint && npm test
          npm run android:sync
          (cd android && ./gradlew --no-daemon assembleDebug lintDebug)
          mkdir -p apk-evidence
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-evidence/kz-home-pilot.apk
          git rev-parse HEAD > apk-evidence/COMMIT.txt
          cd apk-evidence
          sha256sum kz-home-pilot.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs kz-home-pilot.apk > APK-SIGNATURE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kz-home-android-pilot-${{ github.event.pull_request.head.sha || github.sha }}
          path: apk-evidence/
          if-no-files-found: error

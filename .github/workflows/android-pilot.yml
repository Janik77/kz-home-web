name: Android pilot package
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Assemble exact source
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          export ANDROID_HOME="$RUNNER_TEMP/kz-android-sdk"
          tool_url=https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          curl --fail --location --silent --show-error --max-time 180 "$tool_url" -o "$RUNNER_TEMP/kz-sdk-tools.zip"
          printf '%s  %s\n' 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee "$RUNNER_TEMP/kz-sdk-tools.zip" | sha256sum -c -
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/kz-sdk-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          manager="$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager"
          "$manager" --licenses < <(yes) >/dev/null
          "$manager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' >/dev/null
          npm ci
          npm run typecheck && npm run lint && npm test
          npm run android:sync
          (cd android && ./gradlew --no-daemon assembleDebug lintDebug)
          mkdir -p apk-evidence
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-evidence/kz-home-pilot.apk
          git rev-parse HEAD > apk-evidence/COMMIT.txt
          cd apk-evidence
          sha256sum kz-home-pilot.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs kz-home-pilot.apk > APK-SIGNATURE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kz-home-android-pilot-${{ github.event.pull_request.head.sha || github.sha }}
          path: apk-evidence/
          if-no-files-found: error
